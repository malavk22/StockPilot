# docker-compose.yml — runs the full stack: Postgres, backend API, frontend.
#
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:8080
#   Backend:  http://localhost:5100
#
# Set a real JWT_SECRET before running (see backend/.env.example for how to
# generate one) — either export it in your shell or put it in a .env file
# in this directory; compose reads .env automatically.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
      POSTGRES_DB: stockpilot_db
    volumes:
      - stockpilot-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5100
      NODE_ENV: production
      DATABASE_URL: postgresql://stockpilot:stockpilot@db:5432/stockpilot_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before running compose — see backend/.env.example}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5100:5100"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5100
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  stockpilot-db-data:
